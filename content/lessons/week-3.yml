  - type: questions
    heading: "Talk it over"
    items:
      - "Dirckx disagrees with Goff but starts with what she loves about his view. What could you honestly say you love about how the skeptic you know (or any of those ones you have \"met\" in this class) thinks?"
      - "Orr-Ewing asked Steingard what in him recognized that the suffering was wrong. What in the skeptic you know already points toward God?"
      - "Keller found doubts he didn't know he had, and ended up with more peace. Would telling the skeptic you know about your own doubts help or hurt? Why?"
    note_lines: 2

  - type: text
    heading: "Building with those who doubt"
    body: |
      Doubt and unbelief aren't reasons to push away. Just the opposite. Thomas doubted out
      loud, among the disciples, and Jesus came back for him. A father said "I do believe"
      and "help me overcome my unbelief" in the same breath, and Jesus did not send him
      away. Some of the disciples doubted on the mountain, and Jesus sent them out anyway.

      And the skeptic isn't starting from zero. God "has not left himself without testimony"
      (Acts 14:17). The sense that suffering is wrong, wonder at the world around them,
      hunger for justice: these are already there.

      These vestiges of the image of God are foundations on which we build together. Paul
      honored the Athenians' poets, then told them about the man God raised from the dead.
      Our divine family is made to discover truth together. Even he who is the Truth became
      our brother in order to build his new kingdom.

  - type: activity
    kicker: "This week"
    heading: "Practice"
    steps:
      - "Pray again, by name, for the person you've been thinking of."
      - "Listen for one thing they already care about: justice, beauty, truth, kindness. Tell them you see it."
      - "If they share a doubt, thank them before you answer it."
