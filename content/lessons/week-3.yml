# Week 3 lesson. See README.md for every field and section type.
week: 3
title: "Meeting Doubt"
subtitle: "God's witness is already in their world"
date: 2026-10-21
status: published    # planned | draft | published
summary: "God's fingerprints are already in the skeptic's world, and doubt isn't the end of faith."
big_idea: "God has never left himself without a witness. A skeptic's sense of justice and wonder at the world are already pointing somewhere. And doubt can live inside faith: Jesus came back for Thomas. So we meet doubters with mercy and look for common ground before we argue."
handout_notes_lines: 0

sections:
  - type: question
    kicker: "Opening"
    heading: "A question that stuck"
    text: "Think of a time you had a doubt or a question about faith that wouldn't go away. What helped? What didn't?"
    note_lines: 3

  - type: scripture
    kicker: "Meeting doubt · 1"
    heading: "Never without a witness"
    passages:
      - ref: "Acts 14:15–17"
      - ref: "Romans 2:14–15"
    passage_space: 1

  - type: clip
