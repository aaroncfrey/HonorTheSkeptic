    heading: "\"Given what I see\""
    title: "Where is God in Suffering? Jon Steingard & Amy Orr-Ewing"
    channel: "Premier Unbelievable?"
    speaker: "Jon Steingard and Amy Orr-Ewing"
    youtube: feRpdJJ50ds
    start: "11:28"
    end: "16:44"
    setup: |
      Jon Steingard was the lead singer of the Christian band Hawk Nelson. In 2020 he
      announced that he no longer believed in God. Here he tells Amy Orr-Ewing, a Christian
      writer, what started it. Partway through, the host, Justin Brierley, mentions that he
      has been to the same place.
    listen_for:
      - "What Orr-Ewing does before she disagrees with him"
      - "The question she asks about his own reaction"
    ties_to: ["Romans 2:15", "Jude 22"]
