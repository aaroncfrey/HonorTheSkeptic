  - type: scripture
    kicker: "Meeting doubt · 2"
    heading: "Your own poets"
    passages:
      - ref: "Acts 17:16–23"
      - ref: "Acts 17:24–31"
      - ref: "Acts 17:32–34"
    passage_space: 1

  - type: clip
    kicker: "Listen"
    heading: "\"What I love about this view\""
    title: "Does consciousness point to God? Philip Goff & Sharon Dirckx"
    channel: "Premier Unbelievable?"
    speaker: "Philip Goff and Sharon Dirckx"
    youtube: Ef2vvT5GfoE
    start: "43:20"
    end: "44:46"
    setup: |
      Philip Goff is a philosopher who doesn't believe in God. He thinks consciousness is
      part of everything, all the way down (a view called panpsychism). Sharon Dirckx is a
      Christian and a brain scientist. Goff has just finished explaining his view.
    listen_for:
      - "How she begins"
      - "What she finds in his view that she can agree with"
    ties_to: ["Acts 17:28"]
    note_lines: 2

  - type: scripture
    kicker: "Meeting doubt · 3"
    heading: "Room for Thomas"
    passages:
      - ref: "John 20:24–29"
      - ref: "Mark 9:20–27"
      - ref: "Matthew 28:16–20"
      - ref: "Jude 22–23"
    passage_space: 1

  - type: clip
    kicker: "Listen"
    heading: "\"Three more floors\""
    title: "Reason for God? Belief in an Age of Skepticism | Q&A with Tim Keller at Columbia University"
    channel: "The Veritas Forum"
    speaker: "Tim Keller"
    youtube: L9jHlrMRJAo
    start: "1:20:30"
    end: "1:23:40"
    setup: |
      Tim Keller (1950–2023) was a pastor in New York City. At a forum at Columbia
      University in 2008, near the end of the evening, he was asked what gives him peace.
      He answers with a story about his own faith and doubt.
    listen_for:
      - "What happened to Keller's certainty, and to his doubts"
