# Week 1 lesson. See README.md for every field and section type.
week: 1
title: "Who They Are"
subtitle: "Made in God's image, loved by the Father, gifted for the whole family's benefit"
date: 2026-10-07   # Wednesday class date, e.g. 2026-10-14
status: published    # planned | draft | published
summary: "Before a skeptic believes anything, God has already given them dignity, love, and gifts."
big_idea: "We honor skeptics because they are children of God like us. Their skepticism does not change who God made them to be and how much they are needed in his family."
handout_notes_lines: 0

sections:
  - type: question
    kicker: "Opening"
    heading: "Someone you know"
    text: "Write the name or initials of someone you know who doubts or rejects the Christian faith. What is one thing about them you admire?"
    note_lines: 3

  - type: clip
    kicker: "Before we begin"
    heading: "This isn't a game"
    title: "Why Mary's Assumption Is Indefensible (opening remarks)"
    channel: "Gavin Ortlund"
    speaker: "Gavin Ortlund"
    year: 2023
    youtube: skuBFLns8WA
    start: "1:54"
    end: "3:09"
    setup: |
      Before critiquing a belief others hold dear (other Christians, in this case), Protestant scholar
      Gavin Ortlund stops to talk about what it feels like to be on the receiving end and shares the Schaeffer quote below.
    listen_for:
      - "Why he says defending the faith is not a game"
      - "How love handles the job of speaking in a way that might \u201cknock someone over\u201d"
    ties_to: ["James 3:1", "James 3:9-10", "2 Timothy 2:24-25"]

  - type: quote
    kicker: "The quote in the clip"
    heading: "Not a game"
    text: |
      "I need to remind myself constantly that this is not a game I am playing. If I begin to enjoy it as a kind of intellectual exercise, then I am cruel and can expect no real spiritual results. As I push the man off his false balance, he must be able to feel that I care for him. Otherwise I will only end up destroying him, and the cruelty and ugliness of it all will destroy me as well. … Pushing him towards the logic of his presuppositions is going to cause him pain; therefore, I must not push any further than I need to."
    source: "Francis A. Schaeffer, *The God Who Is There* (1968), in *The Francis A. Schaeffer Trilogy* (Crossway, 1990), 138"

  - type: questions
    heading: "Think it over"
    items:
      - "Schaeffer says the other person \"must be able to *feel* that I care for him.\" What makes someone feel cared for, or not, in a conversation about faith?"
      - "How do you figure out how much pain in a conversation is \"necessary\" or \"unavoidable\"? What advice or models can you think of to help with this?"
    note_lines: 2

  - type: scripture
    kicker: "Who they are · 1"
    heading: "Made in God's image"
    passages:
      - ref: "Genesis 1:26–27"
      - ref: "Genesis 9:6"
      - ref: "Psalm 8:3–8"
      - ref: "James 3:9–10"
    passage_space: 1

  - type: clip
    kicker: "Listen"
    heading: "“I intend to treat them like that”"
    title: "Why This Oxford Mathematician is Confident God Exists"
    channel: "Alex O'Connor"
    speaker: "John Lennox"
    youtube: 3gKCwldMZS8
    start: "1:20:12"
    end: "1:22:13"
    setup: |
      Oxford mathematician John Lennox, in conversation with skeptic Alex O'Connor, remembers
      growing up in Northern Ireland during the Troubles, when his own family suffered bombing.
    listen_for:
      - "What his father said when Lennox asked why he took the risk"
      - "What Lennox says that answer taught him to do"
    ties_to: ["Genesis 1:27", "James 3:9"]
    note_lines: 2

  - type: scripture
    kicker: "Who they are · 2"
    heading: "Loved by the Father"
    passages:
      - ref: "Matthew 5:44–45"
      - ref: "John 3:16"
      - ref: "1 Timothy 2:3–4"
      - ref: "Jonah 4:10–11"
    passage_space: 1

  - type: scripture
    kicker: "Who they are · 3"
    heading: "Gifted before they believe"
    passages:
      - ref: "Genesis 4:20–22"
      - ref: "Exodus 18:13–24"
      - ref: "1 Kings 5:1–12"
      - ref: "Isaiah 45:1"
    passage_space: 1

  - type: clip
    kicker: "Listen"
    heading: "Before the debate"
    title: "Alex O'Connor & Glen Scrivener: Morality, Freedom, Slavery & the Bible (Uncommon Ground)"
    channel: "Justin Brierley"
    speaker: "Glen Scrivener"
    youtube: "-ZnVNM8lkGw"
    start: "3:46"
    end: "4:35"
    setup: |
      Before a long debate with skeptic Alex O'Connor, evangelist Glen Scrivener is asked
      what he thinks of the man he is about to disagree with.
    listen_for:
      - "The gifts Scrivener sees in O'Connor"
    ties_to: ["Exodus 18", "Acts 17:28"]
    note_lines: 2

  - type: questions
    heading: "Talk it over"
    items:
      - "Image, love, gifts: which is easiest for you to forget when you're talking with a skeptic? Why?"
      - "What gifts have you seen in non-believers you know? Has God used any of them in your own life?"
      - "James says we bless God and curse people made in his likeness *with the same tongue*. Where have you seen that happen, online or in person?"
    note_lines: 2

  - type: scripture
    kicker: "Then comes the command"
    heading: "Honor everyone"
    passages:
      - ref: "1 Peter 2:17"
      - ref: "1 Peter 3:15–16"
      - ref: "2 Timothy 2:24–26"
    passage_space: 1

  - type: clip
    kicker: "Listen"
    heading: "\"I love you. Thank you.\""
    title: "Breaking Down Walls: A Christian and an Atheist in Conversation"
    channel: "Sean McDowell"
    speaker: "Drew (Genetically Modified Skeptic) and Sean McDowell"
    year: 2021
    youtube: VJX28l54YxE
    start: "41:33"
    end: "45:43"
    setup: |
      Atheist YouTuber Drew has just described how Christians treated him after he shared his
      doubts. Sean McDowell responds, then asks Drew for advice.
    listen_for:
      - "What McDowell says first, before he asks anything"
      - "Drew's three steps for a parent whose child is doubting"
      - "How McDowell receives the advice"
    ties_to: ["Exodus 18:24", "James 1:19", "1 Peter 3:15-16"]
    note_lines: 1

  - type: text
    heading: "One guardrail"
    body: |
      Honoring someone as God's image-bearer doesn't mean that all truth is relative ("your truth"
      vs. "my truth," etc.). It also doesn't mean that skeptics don't need to hear about Christ. We
      honor them because we know who they are, who they are made to be. They are worthy of honor as
      precious and beloved members of the family, even if estranged. Every member of this family
      needs every other one. That's how God designed us.

      So, we tell them about Christ. Knowing Christ as we do, how could we not? Being gentle in
      discussion about faith, truth and eternity isn't weakness in evangelism. Prioritizing a
      listening ear isn't about giving up on sharing the most important story that has ever been
      told by a human tongue. It is showing the same love and patience that God showed to all of us
      by sending his Son to sit with us in our suffering. God's Word in human flesh didn't just
      preach. He connected. He sympathized. He healed.

  - type: activity
    kicker: "This week"
    heading: "Practice"
    steps:
      - "Pray by name for the person you thought of at the start of class."
      - "Thank God for one specific gift you see in them."
      - "If it fits naturally, tell them something you genuinely appreciate about them."
