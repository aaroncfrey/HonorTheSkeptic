# Shown on the home page under "About the class"
about: |
  Most of us know someone who isn't sure about Christianity but is willing to talk about it.
  A friend, a coworker, a grandchild. This class asks what Scripture says about how we talk
  with them: why they deserve our honor, how we listen, how we meet their doubts, and how we
  give the reason for the hope that is in us "with gentleness and respect" (1 Peter 3:15–16).

  Each week pairs Bible study with short clips from real conversations between believers and
  skeptics on YouTube, so we can see what respect looks like (and what it doesn't).

  Everyone is welcome, including doubters. Lessons are posted here each Wednesday before class.

# Show not-yet-published weeks on the home page as "Coming ..." cards
show_upcoming: true
